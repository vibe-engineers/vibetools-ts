name: VibeTools CI
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_archive:
        description: Upload the npm archive that passed the installed-package tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13.0", 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - if: matrix.node != '22.13.0'
        run: npm pack --dry-run
      - name: Test each optional provider against the installed npm archive
        id: packed
        if: matrix.node == '22.13.0'
        run: |
          archive=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          printf 'path=%s\n' "$RUNNER_TEMP/$archive" >> "$GITHUB_OUTPUT"
          for provider in openai @google/genai @typesafe-ai/sdk; do
            consumer=$(mktemp -d)
            version=$(node -p "require('./package.json').devDependencies[process.argv[1]]" "$provider")
            npm install --prefix "$consumer" --no-audit --no-fund "$RUNNER_TEMP/$archive" "$provider@$version"
            case "$provider" in
              openai) testfile=transport.test.mjs; pattern=OpenAI ;;
              @google/genai) testfile=transport.test.mjs; pattern=Gemini ;;
              @typesafe-ai/sdk) testfile=jev.test.mjs; pattern='.*' ;;
            esac
            cp "tests/$testfile" "$consumer/"
            (
              cd "$consumer"
              for other in openai @google/genai @typesafe-ai/sdk; do
                if [ "$other" != "$provider" ]; then
                  node -e "require('node:assert/strict').throws(() => require.resolve(process.argv[1]), { code: 'MODULE_NOT_FOUND' })" "$other"
                fi
              done
              node --test --test-name-pattern="$pattern" "$testfile"
            )
          done
      - name: Upload the tested npm archive
        if: inputs.release_archive && matrix.node == '22.13.0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ steps.packed.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
