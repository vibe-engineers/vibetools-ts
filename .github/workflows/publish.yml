name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      release_archive: true

  inspect:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.archive.outputs.channel }}
      integrity: ${{ steps.archive.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - name: Verify the tested archive and preview staging
        id: archive
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release/*.tgz)
          [[ ${#archives[@]} == 1 ]]
          archive="./${archives[0]}"
          name="${GITHUB_REPOSITORY%-ts}"
          version=$(jq -er '.version' package.json)
          tar -xOzf "$archive" package/package.json | jq -e \
            --arg name "@$name" --arg version "$version" \
            --arg repo "git+https://github.com/$GITHUB_REPOSITORY.git" \
            '.name == $name and .version == $version and .repository.url == $repo and .publishConfig.access == "public"'

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::The tag must match v$version"; exit 1; }
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || { echo "::error::Tag a commit on $DEFAULT_BRANCH"; exit 1; }
          fi
          channel=latest
          if [[ "$version" == *-* ]]; then channel=next; fi
          integrity=$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)
          printf 'channel=%s\nintegrity=%s\n' "$channel" "$integrity" >> "$GITHUB_OUTPUT"
          printf 'Package: @%s@%s\n\nDist-tag: %s\n\nIntegrity: sha512-%s\n' "$name" "$version" "$channel" "$integrity" >> "$GITHUB_STEP_SUMMARY"

          npm stage publish "$archive" --dry-run --ignore-scripts --provenance --access public \
            --tag "$channel" --registry=https://registry.npmjs.org

  stage:
    needs: inspect
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - name: Stage the verified archive with npm provenance
        env:
          RELEASE_CHANNEL: ${{ needs.inspect.outputs.channel }}
          EXPECTED_INTEGRITY: ${{ needs.inspect.outputs.integrity }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(./release/*.tgz)
          [[ ${#archives[@]} == 1 ]]
          archive="${archives[0]}"
          [[ "$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)" == "$EXPECTED_INTEGRITY" ]]
          npm stage publish "$archive" --ignore-scripts --provenance --access public \
            --tag "$RELEASE_CHANNEL" --registry=https://registry.npmjs.org
